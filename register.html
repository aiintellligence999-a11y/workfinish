
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKFINISH - Student Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial;background:#101827;color:white;display:grid;place-items:center;min-height:100vh;padding:20px}
    .card{width:100%;max-width:400px;background:#1d293b;padding:28px;border-radius:18px}
    h1{text-align:center;color:#60a5fa}
    p{text-align:center;color:#bdc8d8}
    input,button{width:100%;padding:14px;margin:9px 0;border-radius:9px;border:0;font-size:15px}
    input{background:#f1f5f9;color:#111}
    button{background:#2563eb;color:white;font-weight:bold;cursor:pointer}
    button.secondary{background:#475569}
    #msg{font-size:14px;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <div class="card">
    <h1>WORKFINISH</h1>
    <p>Student Account</p>

    <input id="name" placeholder="पूरा नाम">
    <input id="mobile" placeholder="मोबाइल नंबर" type="tel">
    <input id="email" placeholder="ईमेल">
    <input id="password" placeholder="पासवर्ड" type="password">

    <button onclick="register()">Register</button>
    <button class="secondary" onclick="login()">Login</button>
    <p id="msg"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://bsbrggofoikseyztqcgy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RsqurUsRe4m9aJpOa-m5aQ_TpyycQs_";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function message(text) {
      document.getElementById("msg").textContent = text;
    }

    async function register() {
      const name = document.getElementById("name").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !mobile || !email || !password) {
        message("सभी जानकारी भरें।");
        return;
      }

      if (!/^[0-9]{10}$/.test(mobile)) {
        message("10 अंकों का मोबाइल नंबर डालें।");
        return;
      }

      if (password.length < 6) {
        message("पासवर्ड कम से कम 6 अक्षर का होना चाहिए।");
        return;
      }

      message("Account बनाया जा रहा है...");

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: name,
            mobile: mobile
          }
        }
      });

      if (error) {
        message(error.message);
        return;
      }

      if (data.session) {
        message("Registration सफल! Redirect हो रहे हैं...");
        window.location.href = "index.html";
      } else {
        message("Registration सफल! अपने ईमेल में verification link देखें।");
      }
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        message("ईमेल और पासवर्ड भरें।");
        return;
      }

      message("Login हो रहा है...");

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message(error.message);
        return;
      }

      window.location.href = "index.html";
    }
  </script>
</body>
</html>
